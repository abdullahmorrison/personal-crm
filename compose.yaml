# Runs the app behind a Cloudflare Tunnel, so nothing listens on the host.
# Put the tunnel token in .env as TUNNEL_TOKEN, then: docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - data:/app/data

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - app

volumes:
  data:
