name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

jobs:
  # Steps run only once the app exists; until then the job passes with nothing to check.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        run: echo "present=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.app.outputs.present == 'true'
        run: npm ci
      - if: steps.app.outputs.present == 'true'
        run: npm run lint --if-present
      - if: steps.app.outputs.present == 'true'
        run: npm run typecheck --if-present
      - if: steps.app.outputs.present == 'true'
        run: npm test --if-present
      - if: steps.app.outputs.present == 'true'
        run: npm run build --if-present

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('Dockerfile') != ''
        run: docker build .

  # The PR title becomes the squashed commit on main, so it must be a conventional commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
