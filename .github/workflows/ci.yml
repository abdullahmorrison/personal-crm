name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

jobs:
  # Steps run only once the app exists; until then the job passes with nothing to check.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        run: echo "present=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.app.outputs.present == 'true'
        run: npm ci
      - if: steps.app.outputs.present == 'true'
        run: npm run lint --if-present
      - if: steps.app.outputs.present == 'true'
        run: npm run typecheck --if-present
      - if: steps.app.outputs.present == 'true'
        run: npm test --if-present
      - if: steps.app.outputs.present == 'true'
        run: npm run build --if-present

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('Dockerfile') != ''
        run: docker build .

  # The PR title becomes the squashed commit on main, so it must be a conventional commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Once main passes, join the tailnet and tell the server to deploy. The server's authorized_keys
  # pins this key to the deploy command, so the key can't do anything else.
  deploy:
    if: github.event_name == 'push'
    needs: [check, docker]
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Port 2222: Tailscale SSH takes port 22 on the tailnet, and it ignores authorized_keys.
          # Trusting the scanned host key is safe here: the tailnet already authenticates the server.
          ssh-keyscan -p 2222 -H "$HOST" >> ~/.ssh/known_hosts
          ssh -p 2222 -i ~/.ssh/deploy "$DEPLOY_USER@$HOST"
